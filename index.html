
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Biblia Digital</title>
  <meta name="description" content="Biblia digital moderna com leitura por livros, capitulos, favoritos, notas e tema ajustavel." />
  <link rel="icon" href="biblia-digital-icon.svg" type="image/svg+xml" />
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f3ec;
      --surface: #fffdf8;
      --surface-strong: #ffffff;
      --ink: #211d18;
      --muted: #70685f;
      --line: #ded6c8;
      --brand: #2f6f62;
      --brand-strong: #184f48;
      --gold: #c9953d;
      --rose: #b05d55;
      --shadow: 0 22px 70px rgba(48, 38, 24, .16);
      --radius: 8px;
      --reader-size: 19px;
      --reader-leading: 1.82;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #111311;
      --surface: #191b18;
      --surface-strong: #22251f;
      --ink: #f2eadf;
      --muted: #b8afa2;
      --line: #38372f;
      --brand: #7ac6b4;
      --brand-strong: #a6ded2;
      --gold: #e0b765;
      --rose: #e18a81;
      --shadow: 0 24px 80px rgba(0, 0, 0, .38);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(246, 243, 236, .82), rgba(246, 243, 236, .96)),
        url("https://images.unsplash.com/photo-1504052434569-70ad5836ab65?auto=format&fit=crop&w=1800&q=80") center top / cover fixed;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    [data-theme="dark"] body,
    body[data-theme="dark"] {
      background:
        linear-gradient(180deg, rgba(17, 19, 17, .80), rgba(17, 19, 17, .98)),
        url("https://images.unsplash.com/photo-1504052434569-70ad5836ab65?auto=format&fit=crop&w=1800&q=80") center top / cover fixed;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .48;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .app {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 24px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: center;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      border: 1px solid color-mix(in srgb, var(--brand), transparent 35%);
      border-radius: var(--radius);
      background: color-mix(in srgb, var(--surface-strong), transparent 8%);
      box-shadow: 0 10px 26px rgba(24, 79, 72, .16);
      color: var(--brand-strong);
      flex: 0 0 auto;
    }

    .brand h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 4vw, 4rem);
      line-height: .94;
      letter-spacing: 0;
    }

    .brand p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: .95rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: end;
      gap: 8px;
    }

    .icon-button,
    .text-button,
    .chapter-button,
    .book-button,
    .verse-action,
    .tab-button {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: color-mix(in srgb, var(--surface-strong), transparent 4%);
      color: var(--ink);
      transition: transform .18s ease, border-color .18s ease, background .18s ease, color .18s ease;
    }

    .icon-button {
      width: 42px;
      height: 42px;
      display: inline-grid;
      place-items: center;
    }

    .text-button {
      min-height: 42px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
    }

    .icon-button:hover,
    .text-button:hover,
    .chapter-button:hover,
    .book-button:hover,
    .verse-action:hover,
    .tab-button:hover {
      transform: translateY(-1px);
      border-color: color-mix(in srgb, var(--brand), transparent 25%);
      background: color-mix(in srgb, var(--brand), var(--surface-strong) 88%);
    }

    .shell {
      display: grid;
      grid-template-columns: minmax(250px, 300px) minmax(0, 1fr) minmax(260px, 330px);
      gap: 16px;
      align-items: start;
    }

    .panel,
    .reader,
    .study {
      background: color-mix(in srgb, var(--surface), transparent 4%);
      border: 1px solid color-mix(in srgb, var(--line), transparent 10%);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .panel,
    .study {
      position: sticky;
      top: 18px;
      max-height: calc(100vh - 36px);
      overflow: hidden;
    }

    .panel-header,
    .study-header {
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }

    .panel-title,
    .study-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .panel-title h2,
    .study-title h2 {
      margin: 0;
      font-size: .86rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .search-wrap {
      position: relative;
    }

    .search-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    .search,
    .select,
    .notes {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-strong);
      color: var(--ink);
      outline: none;
    }

    .search {
      min-height: 42px;
      padding: 0 12px 0 40px;
    }

    .search:focus,
    .select:focus,
    .notes:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand), transparent 78%);
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 12px 16px 0;
    }

    .tab-button {
      height: 38px;
      font-size: .86rem;
      font-weight: 700;
      color: var(--muted);
    }

    .tab-button.active {
      background: var(--brand);
      color: white;
      border-color: var(--brand);
    }

    .book-list {
      display: grid;
      gap: 7px;
      padding: 16px;
      max-height: calc(100vh - 210px);
      overflow: auto;
    }

    .book-button {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      min-height: 44px;
      padding: 9px 10px;
      text-align: left;
    }

    .book-button strong {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: .95rem;
    }

    .book-button span {
      color: var(--muted);
      font-size: .78rem;
    }

    .book-button.active {
      border-color: var(--brand);
      background: color-mix(in srgb, var(--brand), var(--surface-strong) 86%);
      color: var(--brand-strong);
    }

    .reader {
      overflow: hidden;
    }

    .reader-hero {
      min-height: 190px;
      display: grid;
      align-items: end;
      padding: 22px;
      background:
        linear-gradient(115deg, rgba(24, 79, 72, .94), rgba(24, 79, 72, .50)),
        url("https://images.unsplash.com/photo-1519682337058-a94d519337bc?auto=format&fit=crop&w=1400&q=80") center / cover;
      color: white;
    }

    .reader-hero h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.2rem, 5vw, 4.6rem);
      line-height: .95;
      letter-spacing: 0;
    }

    .reader-hero p {
      max-width: 700px;
      margin: 12px 0 0;
      color: rgba(255, 255, 255, .82);
      font-size: 1rem;
    }

    .reader-toolbar {
      display: grid;
      grid-template-columns: minmax(190px, 1fr) minmax(120px, 160px) auto;
      gap: 10px;
      align-items: center;
      padding: 14px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface-strong), transparent 10%);
    }

    .select {
      min-height: 42px;
      padding: 0 10px;
    }

    .stepper {
      display: flex;
      gap: 8px;
      justify-content: end;
    }

    .chapter-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(42px, 1fr));
      gap: 8px;
      padding: 14px;
      border-bottom: 1px solid var(--line);
    }

    .chapter-button {
      min-width: 42px;
      height: 38px;
      font-weight: 700;
    }

    .chapter-button.active {
      border-color: var(--brand);
      background: var(--brand);
      color: white;
    }

    .reader-body {
      padding: clamp(18px, 4vw, 44px);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      min-height: 120px;
    }

    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid color-mix(in srgb, var(--brand), transparent 70%);
      border-top-color: var(--brand);
      border-radius: 999px;
      animation: spin .9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .chapter-heading {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
      align-items: end;
      margin-bottom: 20px;
    }

    .chapter-heading h3 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.8rem, 4vw, 3.1rem);
      letter-spacing: 0;
    }

    .chapter-heading p {
      margin: 8px 0 0;
      color: var(--muted);
    }

    .source {
      color: var(--muted);
      font-size: .82rem;
      text-align: right;
    }

    .verse-list {
      display: grid;
      gap: 7px;
    }

    .verse {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 12px;
      align-items: start;
      padding: 12px 10px;
      border-radius: var(--radius);
    }

    .verse:hover,
    .verse.focused {
      background: color-mix(in srgb, var(--gold), transparent 88%);
    }

    .verse-number {
      display: inline-grid;
      min-width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 999px;
      background: color-mix(in srgb, var(--brand), transparent 86%);
      color: var(--brand-strong);
      font-size: .78rem;
      font-weight: 800;
    }

    .verse-text {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: var(--reader-size);
      line-height: var(--reader-leading);
    }

    mark {
      border-radius: 4px;
      background: color-mix(in srgb, var(--gold), white 35%);
      color: #23180a;
      padding: 0 .12em;
    }

    .verse-actions {
      display: flex;
      gap: 6px;
      opacity: .38;
      transition: opacity .18s ease;
    }

    .verse:hover .verse-actions,
    .verse.focused .verse-actions {
      opacity: 1;
    }

    .verse-action {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      color: var(--muted);
    }

    .verse-action.saved {
      color: var(--rose);
      border-color: color-mix(in srgb, var(--rose), transparent 30%);
      background: color-mix(in srgb, var(--rose), transparent 88%);
    }

    .study-body {
      display: grid;
      gap: 14px;
      padding: 16px;
      max-height: calc(100vh - 104px);
      overflow: auto;
    }

    .meter {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: .86rem;
    }

    .range {
      accent-color: var(--brand);
      width: 100%;
    }

    .notes {
      min-height: 150px;
      resize: vertical;
      padding: 12px;
      line-height: 1.5;
    }

    .saved-list {
      display: grid;
      gap: 8px;
    }

    .saved-item {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-strong);
      padding: 10px;
    }

    .saved-item button {
      width: 100%;
      border: 0;
      background: transparent;
      color: inherit;
      padding: 0;
      text-align: left;
    }

    .saved-ref {
      display: block;
      margin-bottom: 6px;
      color: var(--brand-strong);
      font-size: .82rem;
      font-weight: 800;
    }

    .saved-text {
      display: -webkit-box;
      margin: 0;
      overflow: hidden;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      color: var(--muted);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.5;
    }

    .empty {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 20;
      transform: translate(-50%, 18px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-strong);
      color: var(--ink);
      box-shadow: var(--shadow);
      padding: 12px 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 1180px) {
      .shell {
        grid-template-columns: minmax(220px, 280px) minmax(0, 1fr);
      }

      .study {
        position: static;
        grid-column: 1 / -1;
        max-height: none;
      }

      .study-body {
        max-height: none;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .saved-list,
      .notes-block {
        grid-column: span 1;
      }
    }

    @media (max-width: 820px) {
      .app {
        padding: 14px;
      }

      .topbar {
        grid-template-columns: 1fr;
      }

      .actions {
        justify-content: start;
      }

      .shell {
        grid-template-columns: 1fr;
      }

      .panel {
        position: static;
        max-height: none;
      }

      .book-list {
        max-height: 280px;
      }

      .reader-toolbar {
        grid-template-columns: 1fr;
      }

      .stepper {
        justify-content: stretch;
      }

      .stepper .icon-button {
        flex: 1;
      }

      .study-body {
        grid-template-columns: 1fr;
      }

      .verse {
        grid-template-columns: auto minmax(0, 1fr);
      }

      .verse-actions {
        grid-column: 2;
        opacity: 1;
      }
    }

    @media (max-width: 520px) {
      .brand h1 {
        font-size: 2.35rem;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
      }

      .reader-hero {
        min-height: 160px;
        padding: 18px;
      }

      .chapter-strip {
        grid-template-columns: repeat(auto-fit, minmax(38px, 1fr));
      }

      .reader-body {
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
            <path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H20v17H7.5A2.5 2.5 0 0 0 5 21.5v-17Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            <path d="M5 4.5A2.5 2.5 0 0 0 2.5 2H2v17h.5A2.5 2.5 0 0 1 5 21.5" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            <path d="M12.5 6.3v7.2M8.9 9.9h7.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <h1>Biblia Digital</h1>
          <p>Leitura biblica em portugues, com favoritos e notas.</p>
        </div>
      </div>

      <div class="actions" aria-label="Controles da pagina">
        <button class="icon-button" id="decreaseFont" title="Diminuir texto" aria-label="Diminuir texto">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 19 11 5h2l6 14M8 14h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 19h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-button" id="increaseFont" title="Aumentar texto" aria-label="Aumentar texto">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 19 11 5h2l6 14M8 14h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 6v6M16 9h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-button" id="themeToggle" title="Alternar tema" aria-label="Alternar tema">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 13.2A7.5 7.5 0 0 1 10.8 3a8.5 8.5 0 1 0 10.2 10.2Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <section class="shell" aria-label="Biblia digital">
      <aside class="panel">
        <div class="panel-header">
          <div class="panel-title">
            <h2>Livros</h2>
            <span id="bookCount"></span>
          </div>
          <label class="search-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="m16.2 16.2 4.3 4.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <input class="search" id="bookSearch" type="search" placeholder="Buscar livro" autocomplete="off" />
          </label>
        </div>
        <div class="tabs" role="tablist" aria-label="Testamentos">
          <button class="tab-button active" data-testament="all" type="button">Todos</button>
          <button class="tab-button" data-testament="AT" type="button">Antigo</button>
          <button class="tab-button" data-testament="NT" type="button">Novo</button>
        </div>
        <nav class="book-list" id="bookList" aria-label="Lista de livros"></nav>
      </aside>

      <article class="reader">
        <div class="reader-hero">
          <div>
            <h2 id="heroTitle">Joao 3</h2>
            <p id="heroSubtitle">Joao Ferreira de Almeida</p>
          </div>
        </div>

        <div class="reader-toolbar">
          <label>
            <span class="sr-only">Livro</span>
            <select class="select" id="bookSelect"></select>
          </label>
          <label>
            <span class="sr-only">Capitulo</span>
            <select class="select" id="chapterSelect"></select>
          </label>
          <div class="stepper">
            <button class="icon-button" id="prevChapter" title="Capitulo anterior" aria-label="Capitulo anterior">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m15 18-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="icon-button" id="nextChapter" title="Proximo capitulo" aria-label="Proximo capitulo">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m9 18 6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>

        <div class="chapter-strip" id="chapterStrip" aria-label="Capitulos"></div>
        <div class="reader-body" id="readerBody"></div>
      </article>

      <aside class="study">
        <div class="study-header">
          <div class="study-title">
            <h2>Estudo</h2>
          </div>
          <label class="search-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="m16.2 16.2 4.3 4.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <input class="search" id="chapterSearch" type="search" placeholder="Buscar no capitulo" autocomplete="off" />
          </label>
        </div>
        <div class="study-body">
          <div>
            <div class="meter">
              <span>Tamanho do texto</span>
              <strong id="fontValue">19</strong>
            </div>
            <input class="range" id="fontRange" type="range" min="16" max="24" value="19" />
          </div>

          <div class="notes-block">
            <div class="study-title">
              <h2>Notas</h2>
            </div>
            <textarea class="notes" id="notes" placeholder="Suas notas deste capitulo"></textarea>
          </div>

          <div>
            <div class="study-title">
              <h2>Favoritos</h2>
              <button class="text-button" id="clearFavorites" type="button">Limpar</button>
            </div>
            <div class="saved-list" id="favoritesList"></div>
          </div>
        </div>
      </aside>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const BOOKS = [
      ["GEN", "Genesis", "Genesis", 50, "AT"], ["EXO", "Exodo", "Exodus", 40, "AT"],
      ["LEV", "Levitico", "Leviticus", 27, "AT"], ["NUM", "Numeros", "Numbers", 36, "AT"],
      ["DEU", "Deuteronomio", "Deuteronomy", 34, "AT"], ["JOS", "Josue", "Joshua", 24, "AT"],
      ["JDG", "Juizes", "Judges", 21, "AT"], ["RUT", "Rute", "Ruth", 4, "AT"],
      ["1SA", "1 Samuel", "1 Samuel", 31, "AT"], ["2SA", "2 Samuel", "2 Samuel", 24, "AT"],
      ["1KI", "1 Reis", "1 Kings", 22, "AT"], ["2KI", "2 Reis", "2 Kings", 25, "AT"],
      ["1CH", "1 Cronicas", "1 Chronicles", 29, "AT"], ["2CH", "2 Cronicas", "2 Chronicles", 36, "AT"],
      ["EZR", "Esdras", "Ezra", 10, "AT"], ["NEH", "Neemias", "Nehemiah", 13, "AT"],
      ["EST", "Ester", "Esther", 10, "AT"], ["JOB", "Jo", "Job", 42, "AT"],
      ["PSA", "Salmos", "Psalms", 150, "AT"], ["PRO", "Proverbios", "Proverbs", 31, "AT"],
      ["ECC", "Eclesiastes", "Ecclesiastes", 12, "AT"], ["SNG", "Cantares", "Song of Solomon", 8, "AT"],
      ["ISA", "Isaias", "Isaiah", 66, "AT"], ["JER", "Jeremias", "Jeremiah", 52, "AT"],
      ["LAM", "Lamentacoes", "Lamentations", 5, "AT"], ["EZK", "Ezequiel", "Ezekiel", 48, "AT"],
      ["DAN", "Daniel", "Daniel", 12, "AT"], ["HOS", "Oseias", "Hosea", 14, "AT"],
      ["JOL", "Joel", "Joel", 3, "AT"], ["AMO", "Amos", "Amos", 9, "AT"],
      ["OBA", "Obadias", "Obadiah", 1, "AT"], ["JON", "Jonas", "Jonah", 4, "AT"],
      ["MIC", "Miqueias", "Micah", 7, "AT"], ["NAM", "Naum", "Nahum", 3, "AT"],
      ["HAB", "Habacuque", "Habakkuk", 3, "AT"], ["ZEP", "Sofonias", "Zephaniah", 3, "AT"],
      ["HAG", "Ageu", "Haggai", 2, "AT"], ["ZEC", "Zacarias", "Zechariah", 14, "AT"],
      ["MAL", "Malaquias", "Malachi", 4, "AT"], ["MAT", "Mateus", "Matthew", 28, "NT"],
      ["MRK", "Marcos", "Mark", 16, "NT"], ["LUK", "Lucas", "Luke", 24, "NT"],
      ["JHN", "Joao", "John", 21, "NT"], ["ACT", "Atos", "Acts", 28, "NT"],
      ["ROM", "Romanos", "Romans", 16, "NT"], ["1CO", "1 Corintios", "1 Corinthians", 16, "NT"],
      ["2CO", "2 Corintios", "2 Corinthians", 13, "NT"], ["GAL", "Galatas", "Galatians", 6, "NT"],
      ["EPH", "Efesios", "Ephesians", 6, "NT"], ["PHP", "Filipenses", "Philippians", 4, "NT"],
      ["COL", "Colossenses", "Colossians", 4, "NT"], ["1TH", "1 Tessalonicenses", "1 Thessalonians", 5, "NT"],
      ["2TH", "2 Tessalonicenses", "2 Thessalonians", 3, "NT"], ["1TI", "1 Timoteo", "1 Timothy", 6, "NT"],
      ["2TI", "2 Timoteo", "2 Timothy", 4, "NT"], ["TIT", "Tito", "Titus", 3, "NT"],
      ["PHM", "Filemom", "Philemon", 1, "NT"], ["HEB", "Hebreus", "Hebrews", 13, "NT"],
      ["JAS", "Tiago", "James", 5, "NT"], ["1PE", "1 Pedro", "1 Peter", 5, "NT"],
      ["2PE", "2 Pedro", "2 Peter", 3, "NT"], ["1JN", "1 Joao", "1 John", 5, "NT"],
      ["2JN", "2 Joao", "2 John", 1, "NT"], ["3JN", "3 Joao", "3 John", 1, "NT"],
      ["JUD", "Judas", "Jude", 1, "NT"], ["REV", "Apocalipse", "Revelation", 22, "NT"]
    ].map(([id, name, api, chapters, testament]) => ({ id, name, api, chapters, testament }));

    const els = {
      body: document.body,
      bookList: document.getElementById("bookList"),
      bookCount: document.getElementById("bookCount"),
      bookSearch: document.getElementById("bookSearch"),
      chapterSearch: document.getElementById("chapterSearch"),
      bookSelect: document.getElementById("bookSelect"),
      chapterSelect: document.getElementById("chapterSelect"),
      chapterStrip: document.getElementById("chapterStrip"),
      readerBody: document.getElementById("readerBody"),
      heroTitle: document.getElementById("heroTitle"),
      heroSubtitle: document.getElementById("heroSubtitle"),
      prevChapter: document.getElementById("prevChapter"),
      nextChapter: document.getElementById("nextChapter"),
      themeToggle: document.getElementById("themeToggle"),
      decreaseFont: document.getElementById("decreaseFont"),
      increaseFont: document.getElementById("increaseFont"),
      fontRange: document.getElementById("fontRange"),
      fontValue: document.getElementById("fontValue"),
      notes: document.getElementById("notes"),
      favoritesList: document.getElementById("favoritesList"),
      clearFavorites: document.getElementById("clearFavorites"),
      toast: document.getElementById("toast")
    };

    const store = {
      get(key, fallback) {
        try {
          const value = localStorage.getItem(key);
          return value ? JSON.parse(value) : fallback;
        } catch {
          return fallback;
        }
      },
      set(key, value) {
        localStorage.setItem(key, JSON.stringify(value));
      }
    };

    const state = {
      book: BOOKS.find(book => book.id === (store.get("bible:last", {}).book || "JHN")) || BOOKS[43],
      chapter: store.get("bible:last", {}).chapter || 3,
      verses: [],
      loading: false,
      source: "Joao Ferreira de Almeida",
      testament: "all",
      query: "",
      chapterQuery: "",
      favorites: store.get("bible:favorites", []),
      fontSize: store.get("bible:fontSize", 19),
      theme: store.get("bible:theme", "light")
    };

    function normalize(value) {
      return value.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function highlight(text, query) {
      if (!query.trim()) return escapeHtml(text);
      const safe = escapeHtml(text);
      const terms = query.trim().split(/\s+/).map(term => term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
      if (!terms.length) return safe;
      return safe.replace(new RegExp(`(${terms.join("|")})`, "gi"), "<mark>$1</mark>");
    }

    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => els.toast.classList.remove("show"), 2200);
    }

    function currentKey() {
      return `${state.book.id}-${state.chapter}`;
    }

    function notesKey(book = state.book, chapter = state.chapter) {
      return `bible:notes:${book.id}:${chapter}`;
    }

    function cacheKey(book = state.book, chapter = state.chapter) {
      return `bible:chapter:${book.id}:${chapter}`;
    }

    function renderBookSelect() {
      els.bookSelect.innerHTML = BOOKS.map(book => `
        <option value="${book.id}" ${book.id === state.book.id ? "selected" : ""}>${book.name}</option>
      `).join("");
    }

    function renderChapterSelect() {
      els.chapterSelect.innerHTML = Array.from({ length: state.book.chapters }, (_, index) => {
        const chapter = index + 1;
        return `<option value="${chapter}" ${chapter === state.chapter ? "selected" : ""}>Capitulo ${chapter}</option>`;
      }).join("");
    }

    function renderBooks() {
      const term = normalize(state.query);
      const books = BOOKS.filter(book => {
        const inTestament = state.testament === "all" || book.testament === state.testament;
        const inSearch = normalize(`${book.name} ${book.api} ${book.id}`).includes(term);
        return inTestament && inSearch;
      });

      els.bookCount.textContent = `${books.length}`;
      els.bookList.innerHTML = books.map(book => `
        <button class="book-button ${book.id === state.book.id ? "active" : ""}" data-book="${book.id}" type="button">
          <strong>${book.name}</strong>
          <span>${book.chapters}</span>
        </button>
      `).join("");

      els.bookList.querySelectorAll("[data-book]").forEach(button => {
        button.addEventListener("click", () => selectBook(button.dataset.book, 1));
      });
    }

    function renderChapters() {
      els.chapterStrip.innerHTML = Array.from({ length: state.book.chapters }, (_, index) => {
        const chapter = index + 1;
        return `<button class="chapter-button ${chapter === state.chapter ? "active" : ""}" data-chapter="${chapter}" type="button">${chapter}</button>`;
      }).join("");

      els.chapterStrip.querySelectorAll("[data-chapter]").forEach(button => {
        button.addEventListener("click", () => selectChapter(Number(button.dataset.chapter)));
      });
    }

    function renderChrome() {
      els.heroTitle.textContent = `${state.book.name} ${state.chapter}`;
      els.heroSubtitle.textContent = state.source || "Joao Ferreira de Almeida";
      els.prevChapter.disabled = BOOKS.indexOf(state.book) === 0 && state.chapter === 1;
      els.nextChapter.disabled = BOOKS.indexOf(state.book) === BOOKS.length - 1 && state.chapter === state.book.chapters;
      renderBookSelect();
      renderChapterSelect();
      renderBooks();
      renderChapters();
      els.notes.value = store.get(notesKey(), "");
      store.set("bible:last", { book: state.book.id, chapter: state.chapter });
    }

    function renderReader() {
      if (state.loading) {
        els.readerBody.innerHTML = `<div class="status"><span class="spinner"></span><span>Carregando ${state.book.name} ${state.chapter}</span></div>`;
        return;
      }

      const visibleVerses = state.verses.filter(item => normalize(item.text).includes(normalize(state.chapterQuery)));
      const searchLabel = state.chapterQuery ? `${visibleVerses.length} resultado(s)` : `${state.verses.length} versiculos`;

      if (!state.verses.length) {
        els.readerBody.innerHTML = `
          <div class="status">
            <span>Nao foi possivel carregar este capitulo agora. Tente novamente com conexao ativa.</span>
          </div>
        `;
        return;
      }

      els.readerBody.innerHTML = `
        <div class="chapter-heading">
          <div>
            <h3>${state.book.name} ${state.chapter}</h3>
            <p>${searchLabel}</p>
          </div>
          <div class="source">${escapeHtml(state.source)}</div>
        </div>
        <div class="verse-list">
          ${visibleVerses.map(verse => renderVerse(verse)).join("")}
        </div>
      `;

      els.readerBody.querySelectorAll("[data-favorite]").forEach(button => {
        button.addEventListener("click", () => toggleFavorite(Number(button.dataset.favorite)));
      });

      els.readerBody.querySelectorAll("[data-copy]").forEach(button => {
        button.addEventListener("click", () => copyVerse(Number(button.dataset.copy)));
      });
    }

    function renderVerse(verse) {
      const id = `${state.book.id}-${state.chapter}-${verse.verse}`;
      const saved = state.favorites.some(item => item.id === id);
      return `
        <section class="verse" id="verse-${verse.verse}">
          <span class="verse-number">${verse.verse}</span>
          <p class="verse-text">${highlight(verse.text, state.chapterQuery)}</p>
          <div class="verse-actions" aria-label="Acoes do versiculo ${verse.verse}">
            <button class="verse-action ${saved ? "saved" : ""}" data-favorite="${verse.verse}" type="button" title="Favoritar" aria-label="Favoritar versiculo ${verse.verse}">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="${saved ? "currentColor" : "none"}" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
            </button>
            <button class="verse-action" data-copy="${verse.verse}" type="button" title="Copiar" aria-label="Copiar versiculo ${verse.verse}">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
          </div>
        </section>
      `;
    }

    function renderFavorites() {
      els.clearFavorites.disabled = state.favorites.length === 0;
      if (!state.favorites.length) {
        els.favoritesList.innerHTML = `<p class="empty">Nenhum versiculo favorito ainda.</p>`;
        return;
      }

      els.favoritesList.innerHTML = state.favorites.map(item => `
        <article class="saved-item">
          <button type="button" data-go="${item.id}">
            <span class="saved-ref">${escapeHtml(item.reference)}</span>
            <p class="saved-text">${escapeHtml(item.text)}</p>
          </button>
        </article>
      `).join("");

      els.favoritesList.querySelectorAll("[data-go]").forEach(button => {
        button.addEventListener("click", () => goToFavorite(button.dataset.go));
      });
    }

    function applyTheme() {
      document.documentElement.dataset.theme = state.theme;
      document.body.dataset.theme = state.theme;
      store.set("bible:theme", state.theme);
    }

    function applyFontSize(size) {
      state.fontSize = Math.max(16, Math.min(24, Number(size)));
      document.documentElement.style.setProperty("--reader-size", `${state.fontSize}px`);
      els.fontRange.value = state.fontSize;
      els.fontValue.textContent = state.fontSize;
      store.set("bible:fontSize", state.fontSize);
    }

    async function loadChapter({ preferCache = true } = {}) {
      state.loading = true;
      renderChrome();
      renderReader();

      const cached = store.get(cacheKey(), null);
      if (preferCache && cached?.verses?.length) {
        state.verses = cached.verses;
        state.source = cached.source || "Joao Ferreira de Almeida";
        state.loading = false;
        renderChrome();
        renderReader();
      }

      try {
        const reference = state.book.chapters === 1 ? state.book.api : `${state.book.api} ${state.chapter}`;
        const endpoint = `https://bible-api.com/${encodeURIComponent(reference)}?translation=almeida&single_chapter_book_matching=indifferent`;
        const response = await fetch(endpoint);
        if (!response.ok) throw new Error("Resposta indisponivel");
        const data = await response.json();
        const verses = Array.isArray(data.verses)
          ? data.verses.map(item => ({
              verse: Number(item.verse),
              text: String(item.text || "").trim()
            })).filter(item => item.text)
          : [];
        if (!verses.length) throw new Error("Capitulo vazio");
        state.verses = verses;
        state.source = data.translation_name || "Joao Ferreira de Almeida";
        store.set(cacheKey(), { verses, source: state.source, savedAt: new Date().toISOString() });
      } catch (error) {
        if (!state.verses.length) {
          const fallback = store.get(cacheKey(), null);
          state.verses = fallback?.verses || [];
          state.source = fallback?.source || "Joao Ferreira de Almeida";
          showToast("Nao consegui acessar a fonte online agora.");
        }
      } finally {
        state.loading = false;
        renderChrome();
        renderReader();
      }
    }

    function selectBook(id, chapter = 1) {
      const book = BOOKS.find(item => item.id === id);
      if (!book) return;
      state.book = book;
      state.chapter = Math.min(chapter, book.chapters);
      state.chapterQuery = "";
      els.chapterSearch.value = "";
      state.verses = [];
      loadChapter({ preferCache: true });
    }

    function selectChapter(chapter) {
      state.chapter = Math.max(1, Math.min(state.book.chapters, chapter));
      state.chapterQuery = "";
      els.chapterSearch.value = "";
      state.verses = [];
      loadChapter({ preferCache: true });
    }

    function moveChapter(direction) {
      const index = BOOKS.indexOf(state.book);
      const nextChapter = state.chapter + direction;
      if (nextChapter >= 1 && nextChapter <= state.book.chapters) {
        selectChapter(nextChapter);
        return;
      }

      const nextBook = BOOKS[index + direction];
      if (!nextBook) return;
      state.book = nextBook;
      state.chapter = direction > 0 ? 1 : nextBook.chapters;
      state.verses = [];
      loadChapter({ preferCache: true });
    }

    function toggleFavorite(verseNumber) {
      const verse = state.verses.find(item => item.verse === verseNumber);
      if (!verse) return;
      const id = `${state.book.id}-${state.chapter}-${verse.verse}`;
      const existing = state.favorites.findIndex(item => item.id === id);
      if (existing >= 0) {
        state.favorites.splice(existing, 1);
        showToast("Favorito removido.");
      } else {
        state.favorites.unshift({
          id,
          bookId: state.book.id,
          chapter: state.chapter,
          verse: verse.verse,
          reference: `${state.book.name} ${state.chapter}:${verse.verse}`,
          text: verse.text
        });
        showToast("Versiculo salvo.");
      }
      store.set("bible:favorites", state.favorites);
      renderReader();
      renderFavorites();
    }

    async function copyVerse(verseNumber) {
      const verse = state.verses.find(item => item.verse === verseNumber);
      if (!verse) return;
      const text = `${state.book.name} ${state.chapter}:${verse.verse} - ${verse.text}`;
      try {
        await navigator.clipboard.writeText(text);
        showToast("Versiculo copiado.");
      } catch {
        showToast(text);
      }
    }

    function goToFavorite(id) {
      const favorite = state.favorites.find(item => item.id === id);
      if (!favorite) return;
      const book = BOOKS.find(item => item.id === favorite.bookId);
      if (!book) return;
      state.book = book;
      state.chapter = favorite.chapter;
      state.verses = [];
      loadChapter({ preferCache: true }).then(() => {
        const verse = document.getElementById(`verse-${favorite.verse}`);
        if (verse) {
          verse.classList.add("focused");
          verse.scrollIntoView({ behavior: "smooth", block: "center" });
          window.setTimeout(() => verse.classList.remove("focused"), 2500);
        }
      });
    }

    function bindEvents() {
      els.bookSearch.addEventListener("input", event => {
        state.query = event.target.value;
        renderBooks();
      });

      els.chapterSearch.addEventListener("input", event => {
        state.chapterQuery = event.target.value;
        renderReader();
      });

      document.querySelectorAll("[data-testament]").forEach(button => {
        button.addEventListener("click", () => {
          state.testament = button.dataset.testament;
          document.querySelectorAll("[data-testament]").forEach(item => item.classList.toggle("active", item === button));
          renderBooks();
        });
      });

      els.bookSelect.addEventListener("change", event => selectBook(event.target.value, 1));
      els.chapterSelect.addEventListener("change", event => selectChapter(Number(event.target.value)));
      els.prevChapter.addEventListener("click", () => moveChapter(-1));
      els.nextChapter.addEventListener("click", () => moveChapter(1));

      els.themeToggle.addEventListener("click", () => {
        state.theme = state.theme === "dark" ? "light" : "dark";
        applyTheme();
      });

      els.fontRange.addEventListener("input", event => applyFontSize(event.target.value));
      els.decreaseFont.addEventListener("click", () => applyFontSize(state.fontSize - 1));
      els.increaseFont.addEventListener("click", () => applyFontSize(state.fontSize + 1));

      els.notes.addEventListener("input", event => {
        store.set(notesKey(), event.target.value);
      });

      els.clearFavorites.addEventListener("click", () => {
        state.favorites = [];
        store.set("bible:favorites", state.favorites);
        renderFavorites();
        renderReader();
        showToast("Favoritos limpos.");
      });

      window.addEventListener("keydown", event => {
        if (event.target.matches("input, textarea, select")) return;
        if (event.key === "ArrowLeft") moveChapter(-1);
        if (event.key === "ArrowRight") moveChapter(1);
      });
    }

    function init() {
      bindEvents();
      applyTheme();
      applyFontSize(state.fontSize);
      renderFavorites();
      loadChapter({ preferCache: true });
    }

    init();
  </script>
</body>
</html>
